<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flecto AI — Cyberpunk Engine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(19, 28, 49, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.1), transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            letter-spacing: 1px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .balance-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .agents-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .agent-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .agent-btn.selected {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .agent-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .agent-cost {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            max-width: 85%;
            line-height: 1.4;
        }

        .message.user {
            background: var(--accent);
            color: var(--bg-color);
            align-self: flex-end;
            font-weight: 500;
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .send-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">FLECTO AI</div>
        </header>

        <div class="card">
            <div class="balance-title">Account Balance</div>
            <div class="balance-amount">1000 🪙</div>
            <div class="badge">Expires in 30 days</div>
        </div>

        <div class="card">
            <div class="section-title">Select AI Agent</div>
            <div class="agents-grid">
                <button class="agent-btn selected">
                    <div class="agent-name">Fast Model</div>
                    <div class="agent-cost">25 tokens / request</div>
                </button>
                <button class="agent-btn">
                    <div class="agent-name">Smart Model</div>
                    <div class="agent-cost">75 tokens / request</div>
                </button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Neural Terminal</div>
            <div class="chat-box" id="chat-box">
                <div class="message ai">System initialized. Ready for operations.</div>
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <input type="text" id="user-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chat-box');
            
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = "Flecto AI processed your command.";
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
